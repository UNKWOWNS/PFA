<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>About - PFA Esports League</title>

<!-- Orbitron Font -->
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700&display=swap" rel="stylesheet">

<style>
:root {
  --bg-main: #02030a;
  --bg-soft: #050814;
  --cyan: #00eaff;
  --cyan-soft: #00aacc;
  --glass: rgba(255,255,255,0.06);
  --border: rgba(255,255,255,0.12);
}

/* RESET */
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Orbitron', sans-serif; }

/* BODY */
body {
  background: radial-gradient(circle at top, #071028, var(--bg-main) 65%);
  color: #dff6ff;
  overflow-x: hidden;
}

/* BACKGROUND BLOBS */
.blur-blob {
  position: fixed; width: 420px; height: 420px;
  background: radial-gradient(circle, var(--cyan), transparent 70%);
  filter: blur(180px); opacity:0.18; z-index:-2;
  animation: moveBlob 35s linear infinite alternate;
}
.blob-1 { top: -150px; left: -120px; }
.blob-2 { bottom: -150px; right: -120px; }

@keyframes moveBlob {
  0%{transform:translate(0,0);} 25%{transform:translate(30px,-20px);}
  50%{transform:translate(-25px,25px);} 75%{transform:translate(20px,-30px);}
  100%{transform:translate(0,0);}
}

/* HEADER */
header {
  position: sticky; top:0;
  backdrop-filter: blur(14px);
  background: rgba(2,3,10,0.7);
  border-bottom:1px solid var(--border);
  z-index:100;
}
.header-inner {
  max-width:1300px; margin:auto;
  padding:1.4rem 2.5rem;
  display:flex; justify-content:space-between; align-items:center;
}
.logo { display:flex; align-items:center; gap:1rem; }
.logo img { width:46px; filter: drop-shadow(0 0 10px var(--cyan)); }
.logo span { font-size:1.6rem; font-weight:700; color: var(--cyan); }

/* NAV */
nav { display:flex; gap:2rem; }
nav a {
  text-decoration:none; color:#b6eaff; font-weight:600; position:relative;
}
nav a::after {
  content:""; position:absolute; left:0; bottom:-6px; width:0; height:2px;
  background: var(--cyan); transition:width 0.3s ease;
}
nav a:hover::after,
nav a.active::after { width:100%; }
nav a:hover,
nav a.active { color:#00ffff; }

/* HERO SECTION */
.hero {
  min-height:70vh; display:flex; align-items:center; justify-content:center; text-align:center;
  padding:3rem 2rem;
}
.hero h1 {
  font-size:3.8rem;
  background: linear-gradient(90deg,var(--cyan),#fff);
  -webkit-background-clip:text; -webkit-text-fill-color:transparent;
  text-shadow:0 0 25px var(--cyan);
}
.hero p { margin-top:1.5rem; font-size:1.2rem; opacity:0.75; }

/* BUTTON */
.btn {
  display:inline-block; margin-top:2rem; padding:1rem 2.5rem;
  font-weight:700; font-size:1.1rem;
  border-radius:12px; background:linear-gradient(120deg,var(--cyan),#fff);
  color:#02030a; text-decoration:none;
  position:relative; overflow:hidden; box-shadow:0 0 25px var(--cyan);
  transition: transform 0.3s ease, box-shadow 0.3s ease;
}
.btn::after {
  content:''; position:absolute; left:-120%; top:0; width:120%; height:100%;
  background: linear-gradient(120deg,transparent, rgba(255,255,255,0.6), transparent);
}
.btn::before {
  content:''; position:absolute; bottom:-6px; left:20%; width:60%; height:5px;
  background: var(--cyan); filter: blur(10px); opacity:0; transition: opacity 0.3s ease;
}
.btn:hover::after { animation: sweep 0.8s forwards; }
.btn:hover::before { opacity:1; }
.btn:hover { transform:translateY(-5px); box-shadow:0 0 40px var(--cyan); }
@keyframes sweep { to { transform: translateX(120%); } }

/* ABOUT SECTION */
.about-container {
  display:flex; gap:2rem; max-width:1200px; margin:auto; padding:4rem 2rem; flex-wrap:wrap;
}
.about-image { flex:1; min-width:300px; border-radius:18px; overflow:hidden; box-shadow:0 0 25px var(--cyan); }
.about-image img { width:100%; height:100%; object-fit:cover; display:block; }
.about-text { flex:1.2; min-width:300px; color:#a0d9ff; text-shadow:0 0 6px #54a6ff88, 0 0 12px #5eafff88; }
.about-text h1 { font-size:2.8rem; color:#3ab0ff; margin-bottom:1rem; text-shadow:0 0 8px #3ab0ff; }
.about-text h2 { font-size:1.6rem; margin-top:1.5rem; margin-bottom:0.8rem; color:#5ac8ff; }
.about-text p { font-size:1.1rem; line-height:1.5; margin-bottom:1rem; }

/* FOOTER */
footer {
  text-align:center; padding:3rem 2rem; background: rgba(2,3,10,0.85);
  border-top:1px solid var(--border); opacity:0.7;
}

/* RESPONSIVE */
@media(max-width:900px){
  .about-container { flex-direction:column; }
  .about-image { max-width:100%; height:300px; }
  .about-text { max-width:100%; padding:0 1rem; }
  nav { gap:1.5rem; }
}
</style>
</head>
<body>

      <span>PFA</span>
    </div>
    <nav>
      <a href="index.html">Home</a>
      <a href="about.html" class="active">About</a>
    </nav>
  </div>
</header>

<section class="hero">

  </div>

<section>

  <div class="about-container">

    </div>

         target="_blank" class="btn">View Rulebook</a>
      <h2>Sponsor</h2>
      <p>PFA is sponsored by APEXINNO! They Gave us a prize pool of 300 Dollars+VR accesories</p>
    </div>

<footer>© 2025 PFA Esports League | Powered by Neon Tech</footer>

</body>
</html>
