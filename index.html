<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PFA Esports League</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700&display=swap" rel="stylesheet">

<style>
:root {
  --bg-main: #02030a;
  --bg-soft: #050814;
  --cyan: #00eaff;
  --cyan-soft: #00aacc;
  --glass: rgba(255,255,255,0.06);
  --border: rgba(255,255,255,0.12);
}

/* RESET */
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Orbitron', sans-serif;
  background: radial-gradient(circle at top, #071028, var(--bg-main) 65%);
  color: #dff6ff;
  overflow-x: hidden;
  scroll-behavior: smooth;
}

/* INTRO OVERLAY */
#intro {
  position: fixed;
  inset: 0;
  background: rgba(2,3,10,0.92);
  backdrop-filter: blur(25px);
  z-index: 9999;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: opacity 1s ease, visibility 1s ease;
}

#intro.hidden { opacity: 0; visibility: hidden; }

.intro-content {
  text-align: center;
  animation: introFloat 3s infinite ease-in-out;
}

.intro-content h1 {
  font-size: 4rem;
  background: linear-gradient(90deg, var(--cyan), #ffffff);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  text-shadow: 0 0 40px var(--cyan);
}

.intro-content p {
  margin-top: 1rem;
  opacity: 0.7;
  font-size: 1.1rem;
}

.intro-content span {
  display: inline-block;
  margin-top: 2.5rem;
  font-size: 0.9rem;
  opacity: 0.5;
}

@keyframes introFloat { 0%{transform:translateY(0);}50%{transform:translateY(-12px);}100%{transform:translateY(0);} }

/* BACKGROUND BLUR BLOBS WITH ANIMATION */
.blur-blob {
  position: fixed;
  width: 420px;
  height: 420px;
  background: radial-gradient(circle, var(--cyan), transparent 70%);
  filter: blur(180px);
  opacity: 0.18;
  z-index: -2;
  animation: blobMove 40s linear infinite alternate;
}

.blob-1 { top: -150px; left: -120px; animation-delay: 0s; }
.blob-2 { bottom: -150px; right: -120px; animation-delay: 10s; }

@keyframes blobMove {
  0%   { transform: translate(0, 0); }
  25%  { transform: translate(40px, -20px); }
  50%  { transform: translate(-30px, 30px); }
  75%  { transform: translate(20px, -40px); }
  100% { transform: translate(0, 0); }
}

/* HEADER */
header {
  position: sticky;
  top: 0;
  backdrop-filter: blur(14px);
  background: rgba(2,3,10,0.7);
  border-bottom: 1px solid var(--border);
  z-index: 100;
}

.header-inner {
  max-width: 1300px;
  margin: auto;
  padding: 1.4rem 2.5rem;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.logo { display: flex; align-items: center; gap: 1rem; }
.logo img { width: 46px; filter: drop-shadow(0 0 10px var(--cyan)); }
.logo span { font-size: 1.6rem; font-weight: 700; color: var(--cyan); }

/* NAV */
nav { display: flex; gap: 2.5rem; }
nav a { text-decoration: none; color: #b6eaff; font-weight: 600; position: relative; }
nav a::after {
  content: "";
  position: absolute;
  left: 0; bottom: -6px;
  width: 0; height: 2px;
  background: var(--cyan);
  transition: width 0.3s ease;
}
nav a:hover::after { width: 100%; }

/* HERO */
.hero {
  min-height: 90vh;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 4rem 2rem;
  position: relative;
  z-index: 1;
}
.hero h1 {
  font-size: 4.2rem;
  background: linear-gradient(90deg, var(--cyan), #ffffff);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  text-shadow: 0 0 30px var(--cyan);
}
.hero p {
  margin-top: 1.5rem;
  font-size: 1.3rem;
  opacity: 0.75;
}

/* BUTTON */
.btn {
  margin-top: 3rem;
  display: inline-block;
  padding: 1.1rem 3rem;
  font-size: 1.1rem;
  font-weight: 700;
  border-radius: 14px;
  background: linear-gradient(120deg, var(--cyan), #ffffff);
  color: #02030a;
  text-decoration: none;
  box-shadow: 0 0 30px var(--cyan);
  position: relative;
  overflow: hidden;
  transition: transform 0.3s ease, box-shadow 0.3s ease;
}
.btn::after {
  content: '';
  position: absolute;
  left: -120%;
  top: 0;
  width: 120%;
  height: 100%;
  background: linear-gradient(120deg, transparent, rgba(255,255,255,0.6), transparent);
}
.btn::before {
  content: '';
  position: absolute;
  bottom: -6px; left: 20%;
  width: 60%; height: 6px;
  background: var(--cyan);
  filter: blur(12px);
  opacity: 0;
  transition: opacity 0.3s ease;
}
.btn:hover::after { animation: sweep 0.8s forwards; }
.btn:hover::before { opacity: 1; }
.btn:hover { transform: translateY(-6px); box-shadow: 0 0 45px var(--cyan); }
@keyframes sweep { to { transform: translateX(120%); } }

/* SECTIONS */
section { padding: 6rem 2rem; max-width: 1300px; margin: auto; }
section h2 {
  text-align: center;
  font-size: 3rem;
  margin-bottom: 4rem;
  color: var(--cyan);
}

/* STATS */
.stats {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px,1fr));
  gap: 2rem;
}
.stat {
  background: rgba(0,0,0,0.5);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 2.5rem;
  text-align: center;
  backdrop-filter: blur(14px);
  transition: transform 0.3s ease, box-shadow 0.3s ease;
}
.stat:hover { transform: translateY(-5px); box-shadow: 0 0 30px var(--cyan); }
.stat span { display: block; font-size: 2.7rem; font-weight: 700; color: var(--cyan); }

/* FOOTER */
footer {
  padding: 3rem 2rem;
  text-align: center;
  background: rgba(2,3,10,0.85);
  border-top: 1px solid var(--border);
  opacity: 0.7;
}
</style>
</head>

<body>

<!-- INTRO -->
<div id="intro">
  <div class="intro-content">
    <h1>Welcome to PFA</h1>
    <p>Pro For All</p>
    <span>Click anywhere to enter</span>
  </div>
</div>

<div class="blur-blob blob-1"></div>
<div class="blur-blob blob-2"></div>

<header>
  <div class="header-inner">
    <div class="logo">
      <img src="PFA_LOGO.png">
      <span>PFA</span>
    </div>
    <nav>
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
    </nav>
  </div>
</header>

<section class="hero">
  <div>
    <h1>Pro For All</h1>
    <p>The future of Gorilla Tag esports competition.</p>
    <a href="https://discord.gg/9fW65pjUfc" class="btn">Join the Competition</a>
  </div>
</section>

<section>
  <h2>League Stats</h2>
  <div class="stats">
    <div class="stat"><span>2K</span>Members</div>
    <div class="stat"><span>20+</span>Teams</div>
    <div class="stat"><span>24/7</span>Support</div>
  </div>
</section>

<footer>
  © 2025 PFA Esports League 2026
</footer>

<script>
const intro = document.getElementById("intro");
intro.addEventListener("click", () => { intro.classList.add("hidden"); });
</script>

</body>
</html>
